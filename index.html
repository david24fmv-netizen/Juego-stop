<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stop">
<title>Stop / Basta</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;padding:16px;background:#0f172a;color:#e2e8f0}
h1{font-size:22px;margin:0 0 12px}
h2{font-size:16px;color:#38bdf8;margin:16px 0 6px}
input,textarea{width:100%;box-sizing:border-box;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;padding:10px;font-size:16px;margin:4px 0 10px}
input.pts{width:56px;flex:none;text-align:center;padding:6px;margin:0}
button{background:#38bdf8;border:0;border-radius:8px;padding:10px 16px;font-size:16px;color:#0f172a;width:100%;margin:4px 0}
button.sec{background:#334155;color:#e2e8f0}
button.stop{background:#f87171}
button:disabled{opacity:.4}
.card{background:#1e293b;border-radius:10px;padding:14px;margin:10px 0}
.letra{font-size:54px;text-align:center;font-weight:bold;color:#38bdf8;margin:4px 0}
.tiempo{font-size:22px;text-align:center;margin:4px 0 14px}
.cat{margin:10px 0}
.cat label{font-size:13px;color:#94a3b8}
.fila{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #334155}
.fila:last-child{border-bottom:none}
.col{flex:1;min-width:0}
.col b{font-size:13px;color:#94a3b8;display:block}
.resp{font-size:15px;word-break:break-word}
.vacio{color:#64748b;font-style:italic}
.codigo{font-size:28px;letter-spacing:4px;text-align:center;font-weight:bold;background:#1e293b;border-radius:8px;padding:10px;margin:10px 0}
.avatares{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0;justify-content:center}
.av{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.circ{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px;color:#0f172a}
.av span{font-size:12px;text-align:center;word-break:break-word}
.letras{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.letras button{margin:0;padding:10px 0;background:#334155;color:#e2e8f0}
.letras button.sel{background:#38bdf8;color:#0f172a}
.tot{font-size:16px;text-align:center;margin:10px 0;line-height:1.6}
.nota{font-size:12px;color:#94a3b8;margin-top:10px}
.err{color:#fca5a5}
.espera{color:#94a3b8;text-align:center;margin:14px 0}
</style></head><body>
<div id="app">Cargando...</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJUBnSljZVmiEGk7tt-JCnNKHU8FDIdKE",
  authDomain: "juego-stop-99f57.firebaseapp.com",
  projectId: "juego-stop-99f57",
  storageBucket: "juego-stop-99f57.firebasestorage.app",
  messagingSenderId: "248289979120",
  appId: "1:248289979120:web:793effea55dcaf2a053035"
};
const fb = initializeApp(firebaseConfig);
const db = getFirestore(fb);

const $=sel=>document.querySelector(sel);
const app=$("#app");
const LETRAS="ABCDEFGHIJLMNOPRSTUV".split("");
const CAT_DEF="Nombre,Color,Animal,Fruta,Cosa,País";
const COLORES=["#38bdf8","#4ade80","#fbbf24","#f87171","#a78bfa","#f472b6","#2dd4bf","#fb923c"];

let uid=localStorage.getItem("stop_uid");
if(!uid){uid=crypto.randomUUID();localStorage.setItem("stop_uid",uid);}
let nombre=localStorage.getItem("stop_nombre")||"";
let codigo=localStorage.getItem("stop_codigo")||"";
let unsub=null;
let salaActual=null;
let timerInt=null;
let letraElegida=null;

function colorDe(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%COLORES.length;return COLORES[h];}

function pantallaInicio(err){
  app.innerHTML=`
    <h1>🔤 Stop / Basta</h1>
    <div class="card">
      <label>Tu nombre</label>
      <input id="iNombre" value="${nombre}" placeholder="Ej: David">
      <button id="bCrear">Crear sala nueva</button>
    </div>
    <div class="card">
      <label>Código de una sala existente</label>
      <input id="iCodigo" placeholder="Ej: AB3X" style="text-transform:uppercase">
      <button class="sec" id="bUnir">Unirme a la sala</button>
    </div>
    ${err?`<div class="err">${err}</div>`:""}
  `;
  $("#bCrear").onclick=crearSala;
  $("#bUnir").onclick=()=>unirse($("#iCodigo").value);
}

async function crearSala(){
  const n=$("#iNombre").value.trim();
  if(!n){alert("Escribe tu nombre.");return;}
  nombre=n;localStorage.setItem("stop_nombre",n);
  const code=Array.from({length:4},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
  await setDoc(doc(db,"salas",code),{
    estado:"esperando",ronda:0,categorias:CAT_DEF,letra:null,inicio:null,anfitrion:uid,
    jugadores:{[uid]:{nombre:n,respuestas:{},total:0}}
  });
  entrarSala(code);
}
async function unirse(code){
  code=(code||"").trim().toUpperCase();
  if(!code){alert("Escribe el código de la sala.");return;}
  const n=$("#iNombre").value.trim();
  if(!n){alert("Escribe tu nombre.");return;}
  nombre=n;localStorage.setItem("stop_nombre",n);
  const ref=doc(db,"salas",code);
  const snap=await getDoc(ref);
  if(!snap.exists()){pantallaInicio("No existe una sala con ese código.");return;}
  const d=snap.data();
  if(!d.jugadores[uid]){
    await updateDoc(ref,{["jugadores."+uid]:{nombre:n,respuestas:{},total:0}});
  }
  entrarSala(code);
}
function entrarSala(code){
  codigo=code;localStorage.setItem("stop_codigo",code);
  if(unsub)unsub();
  unsub=onSnapshot(doc(db,"salas",code),snap=>{
    if(!snap.exists()){salir();return;}
    salaActual=snap.data();
    render();
  },()=>pantallaInicio("Se perdió la conexión con la sala."));
}
function salir(){
  if(unsub)unsub();unsub=null;
  codigo="";localStorage.removeItem("stop_codigo");
  if(timerInt)clearInterval(timerInt);
  letraElegida=null;
  pantallaInicio();
}

function render(){
  if(!salaActual)return;
  if(timerInt){clearInterval(timerInt);timerInt=null;}
  if(salaActual.estado==="esperando")return pantallaLobby();
  if(salaActual.estado==="jugando")return pantallaJuego();
  if(salaActual.estado==="stop")return pantallaResultados();
}

function listaJugadores(){
  return Object.entries(salaActual.jugadores||{}).map(([id,j])=>({id,...j}));
}

function pantallaLobby(){
  const js=listaJugadores();
  const soyAnfitrion=salaActual.anfitrion===uid;
  letraElegida=null;
  app.innerHTML=`
    <h1>🔤 Stop / Basta</h1>
    <div class="card">
      <div style="text-align:center">Código de la sala</div>
      <div class="codigo">${codigo}</div>
      <div class="avatares">
        ${js.map(j=>`<div class="av"><div class="circ" style="background:${colorDe(j.id)}">${(j.nombre[0]||"?").toUpperCase()}</div><span>${j.nombre}${j.id===uid?" (tú)":""}${j.id===salaActual.anfitrion?" 👑":""}</span></div>`).join("")}
      </div>
    </div>
    ${salaActual.ronda>0?`<div class="tot">${js.map(j=>`${j.nombre}: <b>${j.total||0}</b> pts`).join(" · ")}</div>`:""}
    <div class="card">
      <label>Categorías (separadas por coma)</label>
      <input id="iCat" value="${salaActual.categorias}" ${soyAnfitrion?"":"disabled"}>
      ${soyAnfitrion?'<button id="bGuardar" class="sec">Guardar categorías</button>':""}
    </div>
    ${soyAnfitrion?`
    <div class="card">
      <label>Elige la letra de la ronda</label>
      <div class="letras" id="gridLetras">
        ${LETRAS.map(l=>`<button data-l="${l}">${l}</button>`).join("")}
      </div>
      <button id="bEmpezar" disabled>▶️ Empezar ronda</button>
    </div>`:`<div class="espera">Esperando a que el anfitrión elija la letra y empiece la ronda...</div>`}
    <button class="sec" id="bSalir">Salir de la sala</button>
  `;
  if(soyAnfitrion){
    $("#bGuardar").onclick=async()=>{
      await updateDoc(doc(db,"salas",codigo),{categorias:$("#iCat").value.trim()||CAT_DEF});
    };
    $("#gridLetras").querySelectorAll("button").forEach(b=>{
      b.onclick=()=>{
        letraElegida=b.dataset.l;
        $("#gridLetras").querySelectorAll("button").forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel");
        $("#bEmpezar").disabled=false;
      };
    });
    $("#bEmpezar").onclick=empezarRonda;
  }
  $("#bSalir").onclick=salir;
}

async function empezarRonda(){
  if(!letraElegida)return;
  const js=listaJugadores();
  const limpio={};
  js.forEach(j=>limpio["jugadores."+j.id+".respuestas"]={});
  await updateDoc(doc(db,"salas",codigo),{
    estado:"jugando",letra:letraElegida,inicio:serverTimestamp(),ronda:(salaActual.ronda||0)+1,...limpio
  });
}

let debounceT={};
function guardarResp(cat,valor){
  clearTimeout(debounceT[cat]);
  debounceT[cat]=setTimeout(()=>{
    updateDoc(doc(db,"salas",codigo),{["jugadores."+uid+".respuestas."+cat]:{texto:valor}});
  },350);
}
async function pararRonda(){
  await updateDoc(doc(db,"salas",codigo),{estado:"stop"});
}

function pantallaJuego(){
  const cats=salaActual.categorias.split(",").map(c=>c.trim()).filter(Boolean);
  const mias=(salaActual.jugadores[uid]&&salaActual.jugadores[uid].respuestas)||{};
  app.innerHTML=`
    <div class="letra">${salaActual.letra}</div>
    <div class="tiempo" id="tTiempo">0 s</div>
    ${cats.map(c=>`
      <div class="cat">
        <label>${c}</label>
        <input data-cat="${c}" value="${(mias[c]&&mias[c].texto)||""}" placeholder="Palabra con ${salaActual.letra}...">
      </div>`).join("")}
    <button class="stop" id="bStop">🛑 ¡Stop!</button>
  `;
  cats.forEach(c=>{
    $(`input[data-cat="${c}"]`).oninput=e=>guardarResp(c,e.target.value);
  });
  $("#bStop").onclick=pararRonda;

  const inicioMs=salaActual.inicio&&salaActual.inicio.toMillis?salaActual.inicio.toMillis():Date.now();
  function tick(){
    const el=$("#tTiempo");
    if(!el)return;
    el.textContent=Math.max(0,Math.floor((Date.now()-inicioMs)/1000))+" s";
  }
  tick();
  timerInt=setInterval(tick,500);
}

function pantallaResultados(){
  const cats=salaActual.categorias.split(",").map(c=>c.trim()).filter(Boolean);
  const js=listaJugadores();

  const filas=cats.map(cat=>{
    const vals=js.map(j=>{
      const r=(j.respuestas&&j.respuestas[cat])||{texto:""};
      return{id:j.id,texto:(r.texto||"").trim(),puntos:r.puntos};
    });
    return{cat,vals};
  });

  app.innerHTML=`
    <h1>Resultados — Ronda ${salaActual.ronda}</h1>
    <div class="jugadores" style="text-align:center;color:#94a3b8">Letra: <b>${salaActual.letra}</b></div>
    ${filas.map(f=>`
      <div class="card">
        <div style="font-size:13px;color:#94a3b8;margin-bottom:4px">${f.cat}</div>
        ${f.vals.map(v=>{
          const j=js.find(x=>x.id===v.id);
          const tiene=!!v.texto;
          return `<div class="fila">
            <div class="col"><b>${j.nombre}${v.id===uid?" (tú)":""}</b>
              <span class="resp ${tiene?"":"vacio"}">${tiene?v.texto:"(sin palabra)"}</span>
            </div>
            ${tiene?`<input class="pts" type="number" inputmode="numeric" min="0" max="20" value="${v.puntos!==undefined?v.puntos:""}" placeholder="pts" data-cat="${f.cat}" data-jid="${v.id}">`:""}
          </div>`;
        }).join("")}
      </div>
    `).join("")}
    <div class="tot" id="sumaPreview"></div>
    <button id="bGuardarPts" class="sec">Sumar puntos y continuar</button>
    <button class="sec" id="bSalir">Salir de la sala</button>
    <div class="nota">Pongan los puntos de cada palabra entre los dos. Las respuestas en blanco no tienen casilla y no suman. Al terminar, toquen "Sumar puntos" una sola vez por ronda.</div>
  `;
  document.querySelectorAll("input.pts").forEach(inp=>{
    inp.oninput=()=>{
      clearTimeout(debounceT[inp.dataset.cat+inp.dataset.jid]);
      debounceT[inp.dataset.cat+inp.dataset.jid]=setTimeout(()=>{
        const v=inp.value===""?null:Math.max(0,parseInt(inp.value)||0);
        updateDoc(doc(db,"salas",codigo),{["jugadores."+inp.dataset.jid+".respuestas."+inp.dataset.cat+".puntos"]:v});
      },300);
    };
  });
  $("#bGuardarPts").onclick=async()=>{
    const upd={};
    js.forEach(j=>{
      let suma=0;
      cats.forEach(c=>{
        const r=(j.respuestas&&j.respuestas[c])||{};
        if(r.texto&&r.puntos)suma+=r.puntos;
      });
      upd["jugadores."+j.id+".total"]=(j.total||0)+suma;
    });
    await updateDoc(doc(db,"salas",codigo),upd);
    $("#bGuardarPts").disabled=true;$("#bGuardarPts").textContent="Puntos sumados ✓";
    setTimeout(()=>updateDoc(doc(db,"salas",codigo),{estado:"esperando"}),600);
  };
  $("#bSalir").onclick=salir;
}

if(codigo)entrarSala(codigo);else pantallaInicio();
</script>
</body></html>
